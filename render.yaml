services:
  - type: web
    name: negociador-api
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node servidor.mjs"
    healthCheckPath: /salud
    envVars:
      # Las claves se introducen a mano en el panel de Render. Nunca en este fichero.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Clave de anam.ai, para los avatares. Si se omite, la sala sigue funcionando en modo texto.
      - key: ANAM_API_KEY
        sync: false
      # Dominios desde los que se permite usar la API. Sin esto, cualquier web podría gastar tu saldo.
      - key: ORIGEN_PERMITIDO
        value: https://negolab.es,https://www.negolab.es,https://druiz-byte.github.io
      # Competición: cadena de conexión de PostgreSQL (Neon). Sin ella, la competición queda desactivada.
      - key: DATABASE_URL
        sync: false
      # Competición: clave del panel del profesor (mínimo 12 caracteres).
      - key: ADMIN_CLAVE
        sync: false
      # Días que se conservan los resultados antes de borrarse solos.
      - key: RETENCION_DIAS
        value: "365"
      - key: EVAL_MAX_DIA
        value: "60"
      - key: EVAL_MAX_HORA_IP
        value: "6"
      - key: MODELO
        value: claude-sonnet-5
      - key: MAX_DIA
        value: "100"
      - key: MAX_HORA_IP
        value: "40"
      - key: MAX_MENSAJES
        value: "60"
      - key: MAX_TOKENS
        value: "900"
      - key: ANAM_MAX_DIA
        value: "80"
      - key: ANAM_MAX_HORA_IP
        value: "20"
